.header-meta{display:flex;gap:18px;color:var(--text-3);font-size:12px;flex-wrap:wrap}
.header-meta b{color:var(--text);font-weight:700}

/* ---------- sticky control bar ---------- */
.ctrl{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:saturate(1.4) blur(6px);border-bottom:1px solid var(--border)}
.ctrl .wrap{display:flex;align-items:center;gap:14px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.ctrl-label{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--text-3)}
.seg{display:inline-flex;background:var(--surface-3);border-radius:8px;padding:3px;gap:2px}
.seg button{padding:7px 16px;border-radius:6px;font-weight:600;color:var(--text-2);font-size:13px;white-space:nowrap;transition:background .15s,color .15s}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgba(17,24,39,.12)}
.search{position:relative;flex:0 1 300px;min-width:200px;margin-left:auto}
.search input{width:100%;height:36px;border:1px solid var(--border);border-radius:8px;padding:0 34px 0 34px;background:var(--surface);font-size:13px;outline:none;transition:border-color .15s,box-shadow .15s}
.search input:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-ring)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-4)}
.search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;color:var(--text-3);display:none;align-items:center;justify-content:center}
.search .clear:hover{background:var(--surface-3)}
.search.has .clear{display:flex}
.btn-reset{height:36px;padding:0 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:13px;font-weight:600;color:var(--text-2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn-reset:hover{border-color:var(--border-2);color:var(--text)}
.btn-reset:disabled{opacity:.45;cursor:default}
.active-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%;min-height:0}
.active-row:empty{display:none}
.token{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 6px 0 10px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600}
.token button{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--accent-2)}
.token button:hover{background:rgba(30,58,95,.12)}
.result-count{font-size:12px;color:var(--text-3)}
.result-count b{color:var(--text);font-size:13px}

/* ---------- filters ---------- */
.filters{background:var(--surface);border-bottom:1px solid var(--border)}
.filters .wrap{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px 14px;padding-top:12px;padding-bottom:12px;align-items:start}
.f-label{font-size:12px;font-weight:700;color:var(--text-3);padding-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{height:28px;padding:0 11px;border:1px solid var(--border);border-radius:15px;background:var(--surface);font-size:12.5px;color:var(--text-2);font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:border-color .12s,background .12s,color .12s}
.chip:hover{border-color:var(--border-2);color:var(--text)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.on .c{color:rgba(255,255,255,.75)}
.chip .c{font-size:11px;color:var(--text-4);font-variant-numeric:tabular-nums}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip.on .dot{box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.chip.zero{opacity:.45}
.chip-sep{width:1px;height:18px;background:var(--border);margin:0 4px}
.chip.m{min-width:46px;justify-content:center;padding:0 8px}

/* ---------- layout ---------- */
main.wrap{padding-top:20px;padding-bottom:60px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.kpi .k{font-size:12px;color:var(--text-3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:4px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v small{font-size:13px;font-weight:600;color:var(--text-3);margin-left:3px}
.kpi .s{font-size:11.5px;color:var(--text-3);margin-top:3px;line-height:1.4}
.kpi.primary{background:var(--accent);border-color:var(--accent)}
.kpi.primary .k,.kpi.primary .s{color:rgba(255,255,255,.72)}
.kpi.primary .v{color:#fff}
.kpi.primary .v small{color:rgba(255,255,255,.7)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-h h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}
.card-h .sub{font-size:12px;color:var(--text-3);margin-top:2px}
.card-b{padding:16px 18px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.grid-2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;margin-top:16px}
.grid-2b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:16px}

/* ---------- annual swimlane ---------- */
.swim-scroll{overflow-x:auto;overflow-y:hidden}
.swim{display:grid;grid-template-columns:108px repeat(12,minmax(88px,1fr)) minmax(132px,1.25fr);min-width:1296px}
.swim .qband{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--text-3);text-align:center;padding:8px 0 6px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.swim .qband.q-odd{background:#F2F4F7}
.swim .qband.tbd{background:repeating-linear-gradient(135deg,#F6F7F9 0 6px,#EFF1F4 6px 7px)}
.swim .mh{padding:8px 8px 7px;border-bottom:1px solid var(--border);border-left:1px solid var(--border);text-align:left;cursor:pointer;transition:background .12s}
.swim .mh:hover{background:var(--surface-2)}
.swim .mh .mn{font-size:13px;font-weight:700}
.swim .mh .mc{font-size:11px;color:var(--text-3)}
.swim .mh .mc b{color:var(--text);font-size:12px}
.swim .mh.sel{background:var(--accent-soft)}
.swim .mh.sel .mn{color:var(--accent)}
.swim .corner{border-bottom:1px solid var(--border);padding:8px 12px;font-size:11px;color:var(--text-3);display:flex;align-items:flex-end}
.lane{position:sticky;left:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 10px 10px 12px;display:flex;flex-direction:column;justify-content:flex-start;gap:2px;cursor:pointer;box-shadow:1px 0 0 var(--border)}
.lane:hover .ln{color:var(--accent)}
.lane .ln{font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;white-space:nowrap}
.lane .ln i{width:9px;height:9px;border-radius:50%;flex:none}
.lane .lc{font-size:11px;color:var(--text-3);padding-left:16px}
.lane.empty .ln{color:var(--text-4)}
.cell{border-bottom:1px solid var(--border);border-left:1px solid var(--border);padding:6px 5px;display:flex;flex-direction:column;gap:4px;min-height:58px;min-width:0;position:relative}
.cell.tbd{background:repeating-linear-gradient(135deg,#FBFBFC 0 6px,#F6F7F9 6px 7px)}
.cell.dim{opacity:.32}
.item{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--ic,#999);border-radius:5px;padding:4px 6px 4px 6px;min-width:0;transition:border-color .12s,box-shadow .12s,transform .12s}
.item:hover{box-shadow:0 2px 6px rgba(17,24,39,.08);transform:translateY(-1px)}
.item .ic{font-size:11.5px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.item .it{font-size:10.5px;color:var(--text-3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35;word-break:break-all}
.item .id{font-size:10px;color:var(--accent-2);font-weight:700;margin-right:3px}
.item .tag{font-size:9.5px;font-weight:700;color:var(--text-3);background:var(--surface-3);border-radius:3px;padding:0 4px;margin-right:3px}
.more{font-size:11px;font-weight:700;color:var(--accent-2);text-align:left;padding:2px 4px;border-radius:4px}
.more:hover{background:var(--accent-soft)}
.swim-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 18px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-3)}
.tbd-key{display:inline-flex;align-items:center;gap:6px}
.tbd-key i{width:16px;height:10px;border:1px solid var(--border-2);background:repeating-linear-gradient(135deg,#FBFBFC 0 3px,#E5E7EB 3px 4px)}

/* ---------- quarter view ---------- */
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:12px}
.qcard{border:1px solid var(--border);border-radius:var(--radius);padding:14px 14px 12px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:10px;min-width:0;transition:border-color .12s,box-shadow .12s}
.qcard:hover{border-color:var(--border-2);box-shadow:0 2px 8px rgba(17,24,39,.06)}
.qcard.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
.qcard.tbdc{background:repeating-linear-gradient(135deg,#FCFCFD 0 8px,#F7F8FA 8px 9px)}
.qcard .qh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.qcard .qn{font-size:18px;font-weight:800;color:var(--accent)}
.qcard .qm{font-size:11.5px;color:var(--text-3)}
.qcard .qt{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.qcard .qt small{font-size:12px;font-weight:600;color:var(--text-3);margin-left:4px}
.qcard .qs{font-size:11.5px;color:var(--text-3)}
.stackbar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;background:var(--surface-3)}
.stackbar i{display:block;height:100%}
.qinds{display:flex;flex-direction:column;gap:3px}
.qind{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2)}
.qind i{width:8px;height:8px;border-radius:50%;flex:none}
.qind span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qind b{font-variant-numeric:tabular-nums}
.qtop{border-top:1px solid var(--border);padding-top:8px;display:flex;flex-direction:column;gap:4px}
.qtop .lbl{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--text-4)}
.qtop div.r{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-2)}
.qtop div.r b{color:var(--text);font-weight:700}
.qtop div.r em{font-style:normal;color:var(--accent-2);font-weight:700;font-size:11px;margin-right:4px}
.qdetail{margin-top:16px}
.month-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.month-col h3{margin:0 0 8px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.month-col h3 span{font-size:12px;color:var(--text-3);font-weight:600}
.stack{display:flex;flex-direction:column;gap:8px}

/* ---------- event card ---------- */
.ev{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;position:relative;min-width:0;transition:border-color .12s,box-shadow .12s,transform .12s}
.ev::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--ic,#999)}
.ev:hover{border-color:var(--border-2);box-shadow:0 3px 10px rgba(17,24,39,.07);transform:translateY(-1px)}
.ev .r1{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ev .co{font-size:13.5px;font-weight:800;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ev .when{font-size:12px;font-weight:700;color:var(--accent-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.ev .when.u{color:var(--text-3);font-weight:600}
.ev .ti{font-size:13px;font-weight:600;color:var(--text);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ev .meta{font-size:11.5px;color:var(--text-3);margin-top:5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ev .meta .sep{width:3px;height:3px;border-radius:50%;background:var(--border-2)}
.ev .ds{font-size:11.5px;color:var(--text-3);margin-top:5px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.ev .opp{margin-top:7px;font-size:11.5px;color:var(--opp);background:var(--opp-bg);border-radius:4px;padding:3px 7px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.badge{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;font-size:10.5px;font-weight:700;white-space:nowrap}
.badge.ready{background:#E7F0EA;color:#2F6B45}
.badge.watch{background:#F1F2F4;color:#4B5563}
.badge.ext{background:#fff;color:var(--text-4);border:1px solid var(--border)}
.ind-tag{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--text-2)}
.ind-tag i{width:7px;height:7px;border-radius:50%}

/* ---------- month view ---------- */
.mstrip{display:grid;grid-template-columns:repeat(12,minmax(0,1fr)) minmax(0,1.25fr);gap:6px;margin-bottom:16px}
.mbtn.tbdm{background:repeating-linear-gradient(135deg,#FCFCFD 0 6px,#F3F4F6 6px 7px);border-style:dashed;border-color:var(--border-2)}
.mbtn.tbdm .mn{font-size:12px;white-space:nowrap}
.mbtn.tbdm .mb i{background:#C9CED6}
.mbtn.tbdm.sel{background:var(--accent-soft);border-style:solid;border-color:var(--accent)}
.unsure-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;background:var(--surface-2);border:1px dashed var(--border-2);border-radius:8px;padding:10px 14px;margin-bottom:16px}
.unsure-head b{font-size:14px;color:var(--accent)}
.unsure-head span{font-size:12px;color:var(--text-3)}
.mbtn{border:1px solid var(--border);border-radius:8px;padding:8px 6px 6px;text-align:center;background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;transition:border-color .12s}
.mbtn:hover{border-color:var(--border-2)}
.mbtn .mn{font-size:13px;font-weight:700}
.mbtn .mc{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.mbtn .mb{width:100%;height:26px;display:flex;align-items:flex-end;justify-content:center}
.mbtn .mb i{display:block;width:60%;max-width:28px;background:#B7C4D6;border-radius:3px 3px 0 0;min-height:2px}
.mbtn.sel{border-color:var(--accent);background:var(--accent-soft)}
.mbtn.sel .mn{color:var(--accent)}
.mbtn.sel .mb i{background:var(--accent)}
.mbtn.next{border-style:dashed}
.mlayout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px}
.mside{display:flex;flex-direction:column;gap:14px;min-width:0}
.mhero .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.mhero .big small{font-size:14px;color:var(--text-3);font-weight:600;margin-left:4px}
.mhero .lbl{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:6px}
.mhero .s{font-size:12px;color:var(--text-3);margin-top:6px}
.hbars{display:flex;flex-direction:column;gap:6px}
.hbar{display:grid;grid-template-columns:84px minmax(0,1fr) 26px;align-items:center;gap:8px;font-size:12px;cursor:pointer;border-radius:4px}
.hbar:hover .hl{color:var(--accent)}
.hbar .hl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-2);display:flex;align-items:center;gap:6px}
.hbar .hl i{width:8px;height:8px;border-radius:50%;flex:none}
.hbar .ht{height:10px;background:var(--surface-3);border-radius:0 3px 3px 0;overflow:hidden}
.hbar .ht i{display:block;height:100%;border-radius:0 3px 3px 0}
.hbar .hv{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.side-box{border:1px solid var(--border);border-radius:8px;padding:12px}
.side-box h4{margin:0 0 8px;font-size:12px;font-weight:700;color:var(--text-2)}
.side-box .hint{font-size:11px;color:var(--text-3);margin:-4px 0 8px}
.mini{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:5px;font-size:12px;width:100%;text-align:left}
.mini:hover{background:var(--surface-2)}
.mini i{width:7px;height:7px;border-radius:50%;flex:none}
.mini b{font-weight:700;white-space:nowrap}
.mini span{color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.mini em{font-style:normal;font-size:11px;color:var(--accent-2);font-weight:700;white-space:nowrap}
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.section-t{font-size:12px;font-weight:700;color:var(--text-3);letter-spacing:.04em;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.section-t:first-child{margin-top:0}
.section-t::after{content:"";flex:1;height:1px;background:var(--border)}

/* ---------- industry view ---------- */
.ilayout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px}
.ilist{display:flex;flex-direction:column;gap:4px}
.ibtn{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:7px;border:1px solid transparent;text-align:left;width:100%}
.ibtn:hover{background:var(--surface-2)}
.ibtn.sel{background:var(--accent-soft);border-color:#C9D6E8}
.ibtn i{width:10px;height:10px;border-radius:50%;flex:none}
.ibtn span{flex:1;font-weight:600;font-size:13px}
.ibtn b{font-variant-numeric:tabular-nums;font-size:12px;color:var(--text-3)}
.ibtn.sel b{color:var(--accent)}
.ihead{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:6px}
.ihead .nm{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.ihead .nm i{width:12px;height:12px;border-radius:50%}
.istat{font-size:12px;color:var(--text-3)}
.istat b{display:block;font-size:18px;color:var(--text);font-weight:800}
.spark{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;align-items:end;height:44px;width:min(360px,100%)}
.spark i{display:block;border-radius:2px 2px 0 0;min-height:2px}
.spark-l{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;width:min(360px,100%);font-size:9.5px;color:var(--text-4);text-align:center;margin-top:3px}
.tl{position:relative;padding-left:0}
.tl-row{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;position:relative}
.tl-m{position:relative;padding:14px 0 10px;text-align:right}
.tl-m b{font-size:15px;font-weight:800}
.tl-m span{display:block;font-size:11px;color:var(--text-3)}
.tl-body{border-left:2px solid var(--border);padding:12px 0 12px 18px;position:relative;min-width:0}
.tl-body::before{content:"";position:absolute;left:-6px;top:20px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--ic,#9CA3AF)}
.tl-row.empty .tl-body::before{border-color:var(--border-2);width:6px;height:6px;left:-4px;top:22px}
.tl-row.empty .tl-m b{color:var(--text-4)}
.tl-row.empty .tl-body{padding-top:16px;padding-bottom:6px}
.tl-empty{font-size:12px;color:var(--text-4)}
.tl-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.tl-row.tbd .tl-body{border-left-style:dashed}

/* ---------- heatmap ---------- */
.heat{width:100%;border-collapse:separate;border-spacing:3px;table-layout:fixed}
.heat th{font-size:11.5px;font-weight:700;color:var(--text-3);padding:4px 6px;text-align:center}
.heat th.rl{text-align:left;width:108px}
.heat th.rl span{display:inline-flex;align-items:center;gap:6px;color:var(--text-2);white-space:nowrap}
.heat th.rl i{width:8px;height:8px;border-radius:50%}

/* ---------- month volume chart ---------- */

/* ---------- list modal ---------- */
.btn-list{display:inline-flex;align-items:center;gap:12px;padding:11px 12px 11px 16px;border-radius:12px;background:#FFD21F;color:#1A1A1A;border:1px solid #E6B800;box-shadow:0 2px 0 #D9AC00,0 6px 16px rgba(230,184,0,.28);white-space:nowrap;transition:transform .12s,box-shadow .12s,background .12s}

.ag-box .ag-t span{font-size:12px;font-weight:700;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:6px;padding:3px 9px}

.fields{display:grid;grid-template-columns:96px minmax(0,1fr);gap:9px 14px;font-size:13px}

}

        <span class="bl-text">전체 이슈 리스트 확인하기<small><b class="num" id="listBtnCount"></b>건 · 한 번에 모아 보기</small></span>
        <span class="bl-click">CLICK <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>

    <div><h2>전체 이슈 리스트 <span class="result-count" id="tableCount" style="margin-left:6px"></span></h2><div class="sub">화면의 필터·검색과 관계없이 항상 전체 이슈를 보여줍니다 · 행을 누르면 상세 정보가 열립니다</div></div>

<script>
/* =========================================================================
   CONFIG — 업종 색상(전 화면 공통) · 이슈 유형 · 기간
   ========================================================================= */
const INDUSTRIES = [
  { key: "금융",         color: "#2e6bc4" },
  { key: "IT",           color: "#1d9a78" },
  { key: "모빌리티",     color: "#6656b8" },
  { key: "게임",         color: "#d0683a" },
  { key: "엔터테인먼트", color: "#1f8fbf" },
  { key: "뷰티·패션",    color: "#c2577f" },
  { key: "유통",         color: "#5f8a2a" },
  { key: "관광·항공",    color: "#a6463f" },
  { key: "식음료",       color: "#c99512" },
  { key: "행사·공공",    color: "#3e4a5c" },
  { key: "기타",         color: "#8a8f98" },
];
const ISSUE_TYPES = [
  "신제품 / 서비스 출시", "게임 / 콘텐츠 출시", "창립기념 / Anniversary", "대형 행사 / 이벤트", "스포츠 / 문화",
  "브랜드 캠페인", "사업 확장 / 신규 진출", "기업 주요 변화", "시즌 마케팅", "기타",
];
const QUARTERS = ["Q1", "Q2", "Q3", "Q4"];
const Q_MONTHS = { Q1: [1, 2, 3], Q2: [4, 5, 6], Q3: [7, 8, 9], Q4: [10, 11, 12] };
const IND_COLOR = Object.fromEntries(INDUSTRIES.map(i => [i.key, i.color]));
const IND_ORDER = Object.fromEntries(INDUSTRIES.map((i, n) => [i.key, n]));
const TYPE_ORDER = Object.fromEntries(ISSUE_TYPES.map((t, n) => [t, n]));
const HEAT_RAMP = ["#F3F6FA", "#DCE5F0", "#BFCEE2", "#97AECB", "#6F8DB3", "#4A6D99", "#2C4F7C"];

/* =========================================================================
   NORMALIZE — 파생 필드 (원본 필드는 변경하지 않음)
   ========================================================================= */
const pad = n => String(n).padStart(2, "0");
const halfLabel = h => (h === "H1" ? "상반기" : "하반기");

function derive(e) {
  const t = e.periodType;
  e._hasMonth = !!e.month && ["date", "month", "range"].includes(t);
  e._q = e.quarter || null;
  e._half = e.half || null;
  // short label (카드·리스트용)
  let short, bucket = null;
  if (t === "date") short = `${pad(e.month)}.${pad(e.day)}`;
  else if (t === "month") short = `${e.month}월`;
  else if (t === "range") {
    if (e.carryOver) short = `연초 진행${e.endMonth ? ` ~${e.endMonth}월` : ""}`;
    else {
      const a = e.day ? `${pad(e.month)}.${pad(e.day)}` : `${e.month}월`;
      const b = e.endMonth ? (e.endDay ? `${pad(e.endMonth)}.${pad(e.endDay)}` : `${e.endMonth}월`) : (e.endLabel || "");
      short = b && b !== a ? `${a}~${b}` : `${a}~`;
    }
  } else if (t === "quarter") { short = `${e.quarter.slice(1)}분기`; bucket = `${e.quarter.slice(1)}분기 (월 미정)`; }
  else if (t === "half") { short = halfLabel(e.half); bucket = `${halfLabel(e.half)} (월 미정)`; }
  else if (t === "season") { short = e.season; bucket = `특정 시즌 · ${e.season}`; }
  else if (t === "year") { short = "2027년 중"; bucket = "연중 (월 미정)"; }
  else if (t === "tbd") { short = "일정 미정"; bucket = "일정 미정"; }
  else if (t === "recurring") { short = e.recurLabel || "정례 행사"; bucket = "정례 행사 · 2027 일정 미발표"; }
  else if (t === "pre") { short = "2026년"; bucket = "2026년 선행 이슈"; }
  e._short = short;
  e._bucket = bucket;
  e._tag = t === "quarter" ? e.quarter : t === "half" ? halfLabel(e.half) : t === "season" ? e.season
         : t === "year" ? "연중" : t === "tbd" ? "미정" : t === "recurring" ? "정례" : t === "pre" ? "2026" : "";

/* =========================================================================

   ========================================================================= */
function heatColor(v, max) {
  if (!v) return ["#FAFBFC", "var(--text-4)"];
  const i = Math.min(HEAT_RAMP.length - 1, Math.max(1, Math.round(v / max * (HEAT_RAMP.length - 1))));
  return [HEAT_RAMP[i], i >= 4 ? "#fff" : "var(--text)"];
}
function renderHeatmap() {
  const f = filtered, lanes = laneList();
  const cols = [...QUARTERS, "U"];
  const cell = (ind, q) => f.filter(e => e.industry === ind && (q === "U" ? !e._q : e._q === q)).length;
  const M = lanes.map(L => cols.map(q => cell(L.key, q)));
  const max = Math.max(1, ...M.flatMap(r => r.slice(0, 4)));
  let h = `<table class="heat"><thead><tr><th class="rl"></th>${QUARTERS.map(q => `<th>${q}</th>`).join("")}<th title="분기가 확정되지 않은 이슈 (상·하반기/연중/미정)">미확정</th><th class="tot">합계</th></tr></thead><tbody>`;
  lanes.forEach((L, r) => {
    h += `<tr><th class="rl"><span><i style="background:${L.color}"></i>${L.key}</span></th>`;
    cols.forEach((q, c) => {
      const v = M[r][c];
      const [bg, fg] = q === "U" ? [v ? "#F3F4F6" : "#FAFBFC", v ? "var(--text-2)" : "var(--text-4)"] : heatColor(v, max);
      const sel = state.industries.size === 1 && state.industries.has(L.key) && (q === "U" ? state.period === "unsure" : state.period === q);
      h += `<td class="${v ? "" : "z"}${q === "U" ? " tbdcol" : ""}${sel ? " sel" : ""}" style="background:${bg};color:${fg}" ${v ? `data-heat="${L.key}|${q}" data-tip="heat"` : ""}>${v || "·"}</td>`;
    });
    h += `<td class="tot num">${M[r].reduce((a, b) => a + b, 0)}</td></tr>`;
  });
  h += `<tr><th class="rl" style="color:var(--text-3)">합계</th>${cols.map((q, c) => `<td class="tot num">${M.reduce((s, r) => s + r[c], 0)}</td>`).join("")}<td class="tot num" style="color:var(--text);font-weight:800">${M.flat().reduce((a, b) => a + b, 0)}</td></tr>`;
  h += `</tbody></table>`;
  $("heatBody").innerHTML = f.length ? h : emptyHTML();
  $("heatScale").innerHTML = `적음 ${HEAT_RAMP.slice(1).map(c => `<i style="background:${c}"></i>`).join("")} 많음`;
}

let panelStack = [];
function openDetail(id, push = true) {

  const O = [["LUUX 제안 포인트", e.opportunity], ["LUUX 연계 포인트", e.linkPoint], ["과거 캠페인", e.pastCampaign]].filter(x => x[1]);

  const feat = e.description ? bullets(e.description) : esc(e._extra || (e.sourceNote && e.sourceNote !== e.title ? e.sourceNote : ""));
  const F = [
    e.scope === "행사" ? ["행사명", `${esc(e._main)} <span style="color:var(--text-3)">(주관: ${esc(e.company)})</span>`, true] : ["기업명", e.company],
    ["일정", e.periodRaw],
    ["주요 이슈명", e.title],
    ["특징", feat, true],
  ].filter(x => x[1]);
  b += `<div class="p-sec">상세 정보</div><dl class="fields">${F.map(([l, v, raw]) => `<dt>${l}</dt><dd>${raw ? v : esc(v)}</dd>`).join("")}</dl>`;
  if (e.note || e.memo) b += `<div class="p-sec">참고사항</div>${e.memo ? `<div class="note" style="margin-bottom:6px">리스트업 메모: ${esc(e.memo)}</div>` : ""}${e.note ? `<div class="note" style="white-space:pre-line">${esc(e.note)}</div>` : ""}`;
  const S = (e.sources || []);
  const D = [
    ["기사 링크", S.length ? `<ul>${S.map(s => `<li>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label || "링크")}</a>` : esc(s.label)}</li>`).join("")}</ul>` : ""],
  ].filter(x => x[1]);
  if (D.length) b += `<div class="p-sec">출처</div><dl class="fields">${D.map(([l, v]) => `<dt>${l}</dt><dd>${v}</dd>`).join("")}</dl>`;
  const rel = events.filter(x => x.company === e.company && x.id !== e.id).sort(bySort);
  if (rel.length) b += `<div class="p-sec">${e.scope === "행사" ? "같은 주관사의 다른 이슈" : "같은 기업의 다른 이슈"} · ${rel.length}</div><div class="related">${rel.map(x => `<button class="mini" data-id="${x.id}"><i style="background:${x._ic}"></i><b>${esc(x._short)}</b><span>${esc(x.scope === "행사" ? x._main : x.title)}</span></button>`).join("")}</div>`;
  $("pBody").innerHTML = b; $("pBody").scrollTop = 0;
  showPanel();
}
function openList(title, arr, push = true) {
  if (push) panelStack = [{ type: "list", title, ids: arr.map(e => e.id) }];
  $("pHead").innerHTML = `<button class="p-close" data-action="close" aria-label="닫기">✕</button><div class="p-co">${esc(title)}</div><div class="p-title">${arr.length}개 이슈</div>`;
  $("pBody").innerHTML = `<div class="stack">${arr.map(e => evCard(e)).join("")}</div>`;
  $("pBody").scrollTop = 0;
  showPanel();
}
function showPanel() { hideTip(); $("panel").classList.add("on"); $("overlay").classList.add("on"); $("panel").setAttribute("aria-hidden", "false"); }
function closePanel() { $("panel").classList.remove("on"); $("overlay").classList.remove("on"); $("panel").setAttribute("aria-hidden", "true"); panelStack = []; }

/* =========================================================================
   TOOLTIP
   ========================================================================= */
const tip = $("tip");
function showTip(target, x, y) {
  const k = target.dataset.tip; let h = "";
  if (k === "ev") { const e = BY_ID.get(+target.dataset.id); h = `<div class="tt">${esc(e._main)} · ${esc(e._short)}</div>${esc(e._sub)}<div style="color:#9CA3AF;margin-top:3px">${esc(e.issueType)}${e.periodRaw ? ` · 원문: ${esc(e.periodRaw)}` : ""}</div>`; }
  if (k === "month") { const m = +target.dataset.m, arr = monthGroups[m - 1] || []; const ic = countBy(arr, e => e.industry);
    h = `<div class="tt">${m}월 · ${arr.length}건</div>` + INDUSTRIES.filter(i => ic.get(i.key)).map(i => `<div class="tr"><span><i style="background:${i.color}"></i>${i.key}</span><b>${ic.get(i.key)}</b></div>`).join(""); }
  if (k === "heat") { const [ind, q] = target.dataset.heat.split("|"); const arr = filtered.filter(e => e.industry === ind && (q === "U" ? !e._q : e._q === q));
    h = `<div class="tt">${ind} × ${q === "U" ? "분기 미확정" : q} · ${arr.length}건</div>` + arr.slice(0, 5).map(e => `<div>· ${esc(e._main)} <span style="color:#9CA3AF">${esc(e._short)}</span></div>`).join("") + (arr.length > 5 ? `<div style="color:#9CA3AF">외 ${arr.length - 5}건</div>` : ""); }
  if (!h) return hideTip();
  tip.innerHTML = h; tip.classList.add("on");
  const r = tip.getBoundingClientRect();
  let lx = x + 14, ly = y + 14;
  if (lx + r.width > innerWidth - 8) lx = x - r.width - 14;
  if (ly + r.height > innerHeight - 8) ly = y - r.height - 14;
  tip.style.left = lx + "px"; tip.style.top = ly + "px";
}
function hideTip() { tip.classList.remove("on"); }
document.addEventListener("mousemove", ev => { const t = $("panel").classList.contains("on") ? null : ev.target.closest("[data-tip]"); t ? showTip(t, ev.clientX, ev.clientY) : hideTip(); }, { passive: true });

/* =========================================================================
   RENDER PIPELINE
   ========================================================================= */
const VIEWS = { annual: renderAnnual, quarter: renderQuarter, month: renderMonth, industry: renderIndustry };
function render() {
  filtered = events.filter(e => matches(e));
  renderFilterChips(); renderActive();
  VIEWS[state.view]();
  renderTable();
}
let raf = 0;
const schedule = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(render); };
const toggleSet = (set, v) => set.has(v) ? set.delete(v) : set.add(v);

/* =========================================================================
   EVENTS (delegation)
   ========================================================================= */
document.addEventListener("click", ev => {
  const t = ev.target.closest("button, [data-period-set], [data-ind-toggle], [data-type-toggle], [data-heat], [data-sort], tr.row, #overlay");
  if (!t) return;
  const d = t.dataset;
  if (t.id === "overlay") return closePanel();
  if (d.action === "close") return closePanel();
  if (d.action === "back") { panelStack.pop(); const top = panelStack[panelStack.length - 1]; if (top?.type === "list") openList(top.title, top.ids.map(i => BY_ID.get(i)), false); else closePanel(); return; }
  if (d.action === "reset") return resetAll();
  if (d.action === "open-list") return toggleList(true);
  if (d.action === "close-list") return toggleList(false);
  if (d.view) { state.view = d.view; document.querySelectorAll("#viewSeg button").forEach(b => b.classList.toggle("on", b === t));
    if (d.view === "month" && state.period[0] !== "m" && state.period !== "unsure") { state.prevPeriod = state.period; state.period = "m1"; }
    else if (d.view !== "month" && state.prevPeriod !== undefined) { state.period = state.prevPeriod; state.prevPeriod = undefined; }
    return schedule(); }
  if (d.cell) { const arr = cellGroups.get(d.cell) || []; const [ind, m] = d.cell.split("|"); return openList(`${m === "u" ? "월 미확정" : m + "월"} · ${ind}`, arr); }
  if (d.id) { if (!$("panel").classList.contains("on")) panelStack = []; return openDetail(d.id); }
  if (d.scope) { state.scope = d.scope; state.tableLimit = 60; return schedule(); }
  if (d.period !== undefined) { state.period = d.period; state.tableLimit = 60; return schedule(); }
  if (d.periodSet) { state.period = state.period === d.periodSet && state.view !== "month" ? "all" : d.periodSet; state.tableLimit = 60; return schedule(); }
  if (d.periodToggle) { state.period = state.period === d.periodToggle ? "all" : d.periodToggle; state.tableLimit = 60; return schedule(); }
  if (d.ind !== undefined) { d.ind ? toggleSet(state.industries, d.ind) : state.industries.clear(); return schedule(); }
  if (d.indToggle) { toggleSet(state.industries, d.indToggle); return schedule(); }
  if (d.indFocus) { state.industries.clear(); state.industries.add(d.indFocus); state.industryFocus = d.indFocus; return schedule(); }
  if (d.type !== undefined) { d.type ? toggleSet(state.types, d.type) : state.types.clear(); return schedule(); }
  if (d.typeToggle) { toggleSet(state.types, d.typeToggle); return schedule(); }
  if (d.heat) { const [ind, q] = d.heat.split("|"); const p = q === "U" ? "unsure" : q;
    const same = state.period === p && state.industries.size === 1 && state.industries.has(ind);
    if (same) { state.period = "all"; state.industries.clear(); } else { state.period = p; state.industries = new Set([ind]); }
    return schedule(); }
  if (d.sort) { state.sort = { key: d.sort, dir: state.sort.key === d.sort ? -state.sort.dir : 1 }; return renderTable(); }
  if (d.untoken) {
    const v = d.val;
    if (d.untoken === "scope") state.scope = "all";
    if (d.untoken === "period") state.period = "all";
    if (d.untoken === "ind") state.industries.delete(v);
    if (d.untoken === "type") state.types.delete(v);
    if (d.untoken === "q") { state.q = ""; $("search").value = ""; $("searchBox").classList.remove("has"); }
    return schedule();
  }
});
function resetAll() {
  state.period = state.view === "month" ? "m1" : "all";
  state.scope = "all"; state.industries.clear(); state.types.clear(); state.q = ""; state.tableLimit = 60;
  $("search").value = ""; $("searchBox").classList.remove("has");
  schedule();
}
$("resetBtn").addEventListener("click", resetAll);
let st = 0;
$("search").addEventListener("input", ev => {
  $("searchBox").classList.toggle("has", !!ev.target.value);
  clearTimeout(st); st = setTimeout(() => { state.q = ev.target.value.trim().toLowerCase(); state.tableLimit = 60; schedule(); }, 120);
});
$("searchClear").addEventListener("click", () => { $("search").value = ""; $("searchBox").classList.remove("has"); state.q = ""; schedule(); });
function toggleList(on) {
  $("listModal").classList.toggle("on", on); $("modalBg").classList.toggle("on", on);
  $("listModal").setAttribute("aria-hidden", on ? "false" : "true");
}
$("modalBg").addEventListener("click", () => toggleList(false));
document.addEventListener("keydown", ev => {
  if (ev.key !== "Escape") return;
  if ($("panel").classList.contains("on")) closePanel(); else toggleList(false);
});

render();
</script>
</body>
